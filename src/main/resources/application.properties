# Alerta Huayco - configuracion de desarrollo (1er Entregable)
spring.application.name=alerta-huayco

# Base de datos en memoria H2 para desarrollo y pruebas locales
spring.datasource.url=jdbc:h2:mem:alertahuayco;DB_CLOSE_DELAY=-1
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

server.port=8080

# ---------------------------------------------------------------
# Para desplegar contra MySQL (segundo entregable), comentar el
# bloque H2 anterior y descomentar lo siguiente:
# spring.datasource.url=jdbc:mysql://localhost:3306/alerta_huayco?useSSL=false&serverTimezone=UTC
# spring.datasource.username=root
# spring.datasource.password=********
# spring.jpa.database-platform=org.hibernate.dialect.MySQLDialect
# ---------------------------------------------------------------
